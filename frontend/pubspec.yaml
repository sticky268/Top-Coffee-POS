name: top_coffee_pos
description: Top Coffee POS - Flutter client (cashier POS, manager console, inventory and daily operations)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Local storage / offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  pdf: ^3.12.0
  archive: ^4.0.9
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Connectivity (for offline detection / sync triggers)
  connectivity_plus: ^6.0.3

  # Utilities
  cryptography: ^2.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.6
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  fonts:
    - family: Niradei
      fonts:
        - asset: assets/fonts/Niradei-Regular.ttf
          weight: 400
        - asset: assets/fonts/Niradei-Black.ttf
          weight: 900
    - family: TopCoffeeReceiptKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmerUI-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
