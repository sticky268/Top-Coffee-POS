name: Kitchen order validation

on:
  push:
    branches:
      - feature/kitchen-order-updates
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel feature tests (SQLite memory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Verify isolated PHPUnit database
        run: |
          grep -q 'name="DB_CONNECTION" value="sqlite"' phpunit.xml
          grep -q 'name="DB_DATABASE" value=":memory:"' phpunit.xml
      - run: php artisan test --filter='KitchenTest|CancelHeldOrderTest|OrderTest|OrderListingTest'

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
