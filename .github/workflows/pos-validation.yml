name: POS validation
on:
  pull_request:
  push:
    branches: [master, feature/kitchen-order-updates]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php vendor/bin/phpunit
  operations-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_DATABASE: operations_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-disposable-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      RUN_OPERATIONS_RELEASE_CHECKS: '1'
      APP_ENV: testing
      APP_KEY: '0123456789abcdef0123456789abcdef'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: operations_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-disposable-password
    defaults:
      run:
        working-directory: backend-skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php vendor/bin/phpunit --filter CafeOperationsTest
      - name: Verify real MySQL contention and populated migration
        run: php vendor/bin/phpunit --filter 'OperationsConcurrencyTest|OperationsMigrationRehearsalTest'
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-flutter-lock
          path: frontend/pubspec.lock
          retention-days: 7
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: top-coffee-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
